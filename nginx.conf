server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Archivos que controlan la versión activa del frontend; nunca deben quedar cacheados en VPS.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* ^/(sw\.js|service-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # S3 image proxy — must appear before the generic static-assets rule so that
    # URLs ending in .png/.jpg etc. are not intercepted by the try_files block.
    # Only forwards to *.amazonaws.com hosts; everything else gets a 403.
    location ~ ^/img-proxy/([^/]+\.amazonaws\.com)(/.*)$ {
        resolver 8.8.8.8 valid=10s;
        set $s3_host $1;
        set $s3_path $2;
        proxy_pass https://$s3_host$s3_path;
        proxy_ssl_server_name on;
        proxy_set_header Host $s3_host;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Cache-Control' 'public, max-age=3600' always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
