# Red compartida (nombre fijo) para conectar servicios de forma predecible
networks:
  default:
    name: satescolar-net

services:
  # ─── PostgreSQL ───
  supabase-db:
    image: supabase/postgres:15.6.1.143
    container_name: sat-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # La imagen supabase/postgres usa supabase_admin (no existe el rol postgres)
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Contraseñas tras migrate.sh de la imagen (no usar 00-init.sql: duplica roles y rompe el init)
      - ./scripts/zz-set-role-passwords.sh:/docker-entrypoint-initdb.d/zz-set-role-passwords.sh:ro
    healthcheck:
      # Sustitución en tiempo de `docker compose` (lee .env); la imagen supabase usa supabase_admin
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-supabase_admin}\" -d \"${POSTGRES_DB:-postgres}\" -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── PostgREST (REST API) ───
  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    container_name: sat-rest
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Supabase Storage ───
  supabase-storage:
    image: supabase/storage-api:v1.11.13
    container_name: sat-storage
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      IS_MULTITENANT: "false"
    volumes:
      - storagedata:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/status >/dev/null 2>&1 || wget -qO- http://127.0.0.1:5000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Aplicar migraciones SQL (esquema + RLS) ───
  supabase-migrations:
    image: postgres:15-alpine
    container_name: sat-migrations
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: supabase-db
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
    command: ["/bin/sh", "/run-migrations.sh"]
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
    restart: "no"

  # ─── GoTrue (Auth) ───
  supabase-auth:
    image: supabase/gotrue:v2.158.1
    container_name: sat-auth
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:3000}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_FROM_NAME:-SAT Escolar}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─── Edge Functions (Deno) ───
  supabase-functions:
    image: supabase/edge-runtime:v1.58.3
    container_name: sat-functions
    ports:
      - "5001:9000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      VERIFY_JWT: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SAT Escolar}
    volumes:
      - ./supabase/functions:/home/deno/functions
    command:
      - start
      - --main-service
      - /home/deno/functions/main
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─── Nginx (API Gateway) ───
  supabase-gateway:
    image: nginx:alpine
    container_name: sat-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_started
      supabase-functions:
        condition: service_started
    restart: unless-stopped

  # ─── Frontend (React + Nginx) ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:8000}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-local}
    container_name: sat-app
    ports:
      - "3000:80"
    depends_on:
      supabase-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  storagedata:
