# Proxy a Supabase Studio con HTTP Basic Auth (usuario/contraseña en .env)
upstream studio_upstream {
    server supabase-studio:3000;
}

server {
    listen 80;
    server_name _;

    # No reenviar el Basic del navegador al upstream (evita confundir a Next)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        auth_basic "Supabase Studio";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_set_header Authorization "";
        proxy_pass http://studio_upstream;
    }
}
