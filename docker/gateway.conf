server {
    listen 8000;
    server_name localhost;

    # ─── CORS helper ───────────────────────────────────────────────────────────
    # Handles preflight OPTIONS and adds headers to every response.
    set $cors_origin "*";

    # Raíz: evitar 404 confuso; la UI va en el contenedor app (p. ej. :3000)
    location = / {
        default_type text/plain;
        return 200 'SAT Escolar API local. GET /health | /auth/v1/ /rest/v1/ /storage/v1/ /functions/v1/ | App: http://localhost:3000';
    }

    # ─── /auth/v1/ → GoTrue ────────────────────────────────────────────────────
    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        proxy_pass         http://supabase-auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info' always;
    }

    # ─── /rest/v1/ → PostgREST ─────────────────────────────────────────────────
    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, Prefer, X-Client-Info' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        proxy_pass         http://supabase-rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward the apikey as Authorization Bearer when present
        proxy_set_header   Authorization     $http_authorization;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, Prefer, X-Client-Info' always;
    }

    # ─── /storage/v1/ → Storage API ────────────────────────────────────────────
    location /storage/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        proxy_pass            http://supabase-storage:5000/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        client_max_body_size  50m;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info' always;
    }

    # ─── /functions/v1/ → Edge Runtime ─────────────────────────────────────────
    location /functions/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        proxy_pass         http://supabase-functions:9000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info' always;
    }

    # ─── Health check ───────────────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
