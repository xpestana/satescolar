server {
    listen 8000;
    server_name localhost;

    # Docker DNS (127.0.0.11) + refresh periódico para evitar cachear IPs viejas
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ─── CORS helper ───────────────────────────────────────────────────────────
    # Handles preflight OPTIONS and adds headers to every response.
    set $cors_origin "*";

    # Raíz: evitar 404 confuso; la UI va en el contenedor app (p. ej. :3000)
    location = / {
        default_type text/plain;
        return 200 'SAT Escolar API local. GET /health | /auth/v1/ /rest/v1/ /storage/v1/ /functions/v1/ | App: http://localhost:3000';
    }

    # ─── /auth/v1/ → GoTrue ────────────────────────────────────────────────────
    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info, x-supabase-api-version' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        set $auth_upstream http://supabase-auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass         $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # GoTrue también emite CORS; sin ocultarlas, el navegador ve "*, *" duplicado.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info, x-supabase-api-version' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
    }

    # ─── /rest/v1/ → PostgREST ─────────────────────────────────────────────────
    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, Prefer, Accept-Profile, Content-Profile, X-Client-Info, x-supabase-api-version' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        set $rest_upstream http://supabase-rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass         $rest_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward the apikey as Authorization Bearer when present
        proxy_set_header   Authorization     $http_authorization;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, Prefer, Accept-Profile, Content-Profile, X-Client-Info, x-supabase-api-version' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
    }

    # ─── /storage/v1/ → Storage API ────────────────────────────────────────────
    location /storage/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info, x-supabase-api-version' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        set $storage_upstream http://supabase-storage:5000;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass            $storage_upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        client_max_body_size  50m;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info, x-supabase-api-version' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
    }

    # ─── /functions/v1/ → Edge Runtime ─────────────────────────────────────────
    location /functions/v1/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info, x-supabase-api-version' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        set $functions_upstream http://supabase-functions:9000;
        rewrite ^/functions/v1/(.*)$ /$1 break;
        proxy_pass         $functions_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, apikey, Content-Type, X-Client-Info, x-supabase-api-version' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length' always;
    }

    # ─── Health check ───────────────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
